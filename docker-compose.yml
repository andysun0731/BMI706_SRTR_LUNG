version: '3.8'

services:
  backend:
    build: ./backend
    container_name: bmi706-api
    environment:
      - DATA_PATH=/app/data
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: bmi706-web
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: bmi706-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
